server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker 相关文件不缓存，避免更新后客户端拿到旧版本
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 上传手机照片/合同 PDF（HEIC 原图常有 3~8MB，一份资料可多张），nginx 默认只允许 1MB 会报 413
    client_max_body_size 50m;

    # /api/v1 反向代理到 api 容器（同源，前端不需要处理CORS）
    location /api/v1/ {
        proxy_pass http://api:3000/api/v1/;
        # AI 读图识别（合同、评估表、日常记录）单次可能要 1~2 分钟，默认 60 秒会被 nginx 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history模式：非静态文件请求一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
