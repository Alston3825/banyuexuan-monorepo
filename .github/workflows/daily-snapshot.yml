name: Daily handoff snapshot

# 每天北京时间 03:30 自动刷新 docs/进度快照.md（给“换 AI 接手”用），有变化才提交；也可在 Actions 页面手动运行
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate snapshot
        run: bash scripts/generate-handoff-snapshot.sh
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/进度快照.md; then echo "no change"; exit 0; fi
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add docs/进度快照.md
          git commit -m "chore(docs): 自动刷新进度快照 [skip ci]"
          git push origin HEAD:main
